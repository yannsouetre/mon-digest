<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f0e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Mon Digest</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0f0e;--panel:#151816;--item:#1c1f1c;--line:#353934;--text:#eee9df;--muted:#aaa398;--accent:#ef7272;--serif:Georgia,"Times New Roman",serif;--sans:Inter,Segoe UI,sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);padding-bottom:env(safe-area-inset-bottom,0px)}
    header{position:sticky;top:0;z-index:20;background:rgba(13,15,14,.96);border-bottom:1px solid #292c28;backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
    .bar{width:min(760px,100%);margin:auto;min-height:50px;padding:8px 14px;display:flex;align-items:center;gap:12px}
    .brand{font:700 15px/1 var(--sans);letter-spacing:.22em;flex:0 0 auto;margin-right:auto}.brand span{color:var(--accent)}.stamp{font:600 10px/1.2 var(--sans);color:var(--muted);margin-left:auto;align-self:center;flex:0 0 auto;padding-left:8px;white-space:nowrap}
    .bar button{flex:0 0 auto;width:34px;height:34px;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:50%;cursor:pointer}
    .bar button:hover{border-color:var(--accent)}.bar button svg{width:16px;height:16px;display:block}
    nav{width:min(760px,100%);margin:auto;padding:0 14px 8px;display:flex;gap:6px;overflow:auto}
    nav a,.version{white-space:nowrap;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:700 11px/1 var(--sans)}
    main{width:min(760px,100%);margin:auto;padding:14px}.subject{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;scroll-margin-top:104px}
    .subject-head{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}.index{color:var(--accent);font:800 12px/1 var(--sans);letter-spacing:.08em}.subject h2{font-size:31px;line-height:1;margin:0}.subtitle{color:var(--muted);font:700 11px/1 var(--sans)}
    .versions{margin-left:auto;display:flex;gap:5px}.version{cursor:pointer;background:none}.version.active{color:var(--text);border-color:#744d4d;background:#3a2525}
    h3{margin:14px 0 6px;color:#bcb2a5;font:800 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
    details{background:var(--item);border-radius:10px;margin:6px 0;border-left:2px solid transparent;overflow:hidden}details[open]{border-left-color:var(--accent)}
    summary{list-style:none;cursor:pointer;padding:11px 44px 11px 12px;position:relative;font-size:20px;line-height:1.2}summary::-webkit-details-marker{display:none}summary:after{content:"+";position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font:17px/1 var(--sans);color:var(--muted)}details[open] summary:after{content:"×";color:var(--accent);border-color:var(--accent)}
    .channel{font-weight:700;color:#d0bda7}.time{font:700 12px/1 var(--sans)}.body{padding:0 12px 12px;font-size:17px;line-height:1.45}.body p{margin:4px 0 8px}.body ul{margin:6px 0 10px;padding-left:22px}.takeaway{border-top:1px solid var(--line);padding-top:8px}.takeaway strong{color:var(--accent)}
    .thumb{display:block;width:auto;max-width:min(500px,100%);height:auto;max-height:420px;object-fit:contain;margin:12px auto 4px;border:1px solid var(--line);border-radius:9px}.thumb.poster{max-height:350px}.thumb.cover{width:min(300px,100%);max-height:300px}
    .meta,.source,.empty,.errors{font:600 11px/1.4 var(--sans);color:var(--muted)}.source{color:var(--accent)}.empty{font-family:var(--serif);font-style:italic;font-size:16px;font-weight:400}.shorts{margin-top:10px}.errors{border:1px solid #724444;border-radius:9px;padding:8px}.images-off .thumb{display:none}
    .loading,.loaderr{width:min(760px,100%);margin:40px auto;text-align:center;color:var(--muted);font-family:var(--sans);font-size:14px;padding:0 14px}
    .loaderr b{color:var(--accent)}
    @media(max-width:520px){.bar{gap:8px}.stamp{font-size:10px}.subject h2{font-size:27px}.subject{padding:11px;scroll-margin-top:96px}summary{font-size:18px}.body{font-size:16px}.subtitle{display:none}}
  </style>
</head>
<body>
  <header>
    <div class="bar"><div class="brand">MON <span>DIGEST</span></div><button id="reload" title="Actualiser" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button><button id="images" title="Afficher ou masquer les images" aria-label="Images"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button><button id="openAll" title="Tout déplier" aria-label="Tout déplier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button><button id="closeAll" title="Tout replier" aria-label="Tout replier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button></div>
    <nav><a href="#news">01 Actualités</a><a href="#youtube">02 YouTube</a><a href="#releases">03 Sorties</a><span class="stamp" id="stamp">Chargement…</span></nav>
  </header>
  <main id="app"><div class="loading">Chargement du digest…</div></main>
  <script>
    let data=null;
    const ORDER=['20h','14h','09h'];
    let newsFilter=null,ytFilter=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const clean=s=>String(s??'').replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{1F1E6}-\u{1F1FF}]/gu,'').replace(/\s{2,}/g,' ').trim();
    const item=x=>`<details><summary>${x.channel?`<span class="channel">${esc(clean(x.channel))}</span> | `:''}${esc(clean(x.title))} ${x.time_label?`<span class="time">(${esc(x.time_label)})</span>`:''}</summary><div class="body">${x.summary?`<p>${esc(x.summary)}</p>`:''}${x.bullets?.length?`<ul>${x.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}${x.takeaway?`<p class="takeaway"><strong>À retenir :</strong> ${esc(x.takeaway)}${x.caution_note?` <span title="${esc(x.caution_note)}">⚠</span>`:''}</p>`:''}${x.thumbnail_url?`<img loading="lazy" class="thumb ${esc(x.thumbnail_kind||'landscape')}" src="${esc(x.thumbnail_url)}" alt="">`:''}${x.meta?`<span class="meta">${esc(x.meta)}</span> `:''}${x.url?`<a class="source" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Ouvrir la source ↗</a>`:''}</div></details>`;
    const group=g=>`<h3>${esc(g.name)}</h3>${g.items?.length?g.items.map(item).join(''):`<p class="empty">${esc(g.empty_message||'Pas de nouveautés')}</p>`}`;
    const byTime=(a,b)=>ORDER.indexOf(a.time_label)-ORDER.indexOf(b.time_label);
    const chips=(labels,active,attr)=>labels.map(l=>`<button class="version ${l===active?'active':''}" data-${attr}="${esc(l)}" title="Filtrer : ${esc(l)} (re-cliquer pour tout afficher)">${esc(l)}</button>`).join('');
    const sortedLabels=l=>[...new Set(l)].filter(Boolean).sort((a,b)=>parseInt(a)-parseInt(b));
    const newsLabels=()=>sortedLabels(data.news.versions.map(v=>v.label));
    const newsSections=()=>{
      const names=[];data.news.versions.forEach(v=>v.sections.forEach(s=>{if(!names.includes(s.name))names.push(s.name)}));
      const vers=[...data.news.versions].sort((a,b)=>ORDER.indexOf(a.label)-ORDER.indexOf(b.label));
      const use=newsFilter?vers.filter(v=>v.label===newsFilter):vers;
      return names.map(name=>{const items=[],seen=new Set();let empty=null;
        use.forEach(v=>{const s=v.sections.find(x=>x.name===name);if(!s)return;if(s.empty_message&&!empty)empty=s.empty_message;(s.items||[]).forEach(it=>{if(!seen.has(it.id)){seen.add(it.id);items.push(it)}})});
        return {name,items,empty_message:empty||'Pas de nouveauté significative'}});
    };
    const renderNews=()=>`<section class="subject" id="news"><div class="subject-head"><span class="index">01</span><h2>Actualités</h2><span class="subtitle">Priorités et alertes</span><div class="versions">${chips(newsLabels(),newsFilter,'newsfilter')}</div></div><div id="newsBody">${newsSections().map(group).join('')}</div></section>`;
    const ytLabels=()=>sortedLabels([...data.youtube.videos,...data.youtube.shorts].map(x=>x.time_label));
    const ytFiltered=arr=>[...(ytFilter?arr.filter(x=>x.time_label===ytFilter):arr)].sort(byTime);
    const renderYoutube=()=>{const vids=ytFiltered(data.youtube.videos),shorts=ytFiltered(data.youtube.shorts);
      const groups=vids.reduce((a,x)=>((a[x.category||'Autres']??=[]).push(x),a),{});
      return `<section class="subject" id="youtube"><div class="subject-head"><span class="index">02</span><h2>YouTube</h2><span class="subtitle">Vidéos à retenir</span><div class="versions">${chips(ytLabels(),ytFilter,'ytfilter')}</div></div>${Object.entries(groups).map(([name,items])=>group({name,items})).join('')||`<p class="empty">${ytFilter?'Pas de vidéo pour ce créneau':'Pas de nouvelle vidéo'}</p>`}${shorts.length?`<details class="shorts"><summary>Shorts (${shorts.length})</summary><div class="body">${shorts.map(item).join('')}</div></details>`:''}</section>`};
    const render=()=>{const d=new Date(data.generated_at);document.getElementById('stamp').textContent=`${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})} · ${data.slot} · maj ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;document.getElementById('app').innerHTML=renderNews()+renderYoutube()+`<section class="subject" id="releases"><div class="subject-head"><span class="index">03</span><h2>Sorties</h2><span class="subtitle">Culture et médias</span></div>${data.releases.groups.map(group).join('')}</section>${data.errors?.length?`<div class="errors">${data.errors.map(esc).join('<br>')}</div>`:''}`;bind()};
    const bind=()=>{document.querySelectorAll('[data-newsfilter]').forEach(b=>b.onclick=()=>{newsFilter=newsFilter===b.dataset.newsfilter?null:b.dataset.newsfilter;render()});document.querySelectorAll('[data-ytfilter]').forEach(b=>b.onclick=()=>{ytFilter=ytFilter===b.dataset.ytfilter?null:b.dataset.ytfilter;render()})};
    // Reclassement Shorts côté navigateur : la miniature verticale oardefault.jpg n'existe (en portrait) que pour les Shorts
    const classifyShorts=()=>Promise.all(data.youtube.videos.filter(v=>(v.duration_s==null||v.duration_s<=185)&&!v._checked).map(v=>new Promise(res=>{v._checked=true;const im=new Image();const done=()=>res();im.onload=()=>{if(im.naturalHeight>im.naturalWidth)v._short=true;done()};im.onerror=done;setTimeout(done,4000);im.src=`https://i.ytimg.com/vi/${v.id}/oardefault.jpg`;}))).then(()=>{const moved=data.youtube.videos.filter(v=>v._short);if(moved.length){data.youtube.shorts=[...moved,...data.youtube.shorts];data.youtube.videos=data.youtube.videos.filter(v=>!v._short);}});
    async function load(){
      document.getElementById('stamp').textContent='Chargement…';
      try{
        const r=await fetch('digest.json?ts='+Date.now(),{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        data=await r.json();newsFilter=null;ytFilter=null;render();classifyShorts().then(render);
      }catch(e){
        if(data) return; // garde l'affichage courant si simple échec de rafraîchissement
        document.getElementById('stamp').textContent='Hors ligne';
        document.getElementById('app').innerHTML=`<div class="loaderr"><b>Impossible de charger le digest.</b><br>Vérifie ta connexion puis appuie sur ↻.<br><span style="opacity:.6">${esc(e.message)}</span></div>`;
      }
    }
    document.getElementById('reload').onclick=load;
    document.getElementById('images').onclick=()=>document.body.classList.toggle('images-off');document.getElementById('openAll').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('closeAll').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    load();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) load();});
  </script>
</body>
</html>
